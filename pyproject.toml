[project]
name = "yoruba-instruct"
version = "0.1.0"
description = "Fine-tuning Qwen 2.5-3B for Yoruba instruction following using QLoRA, SFT, and DPO. Built as a contribution to low-resource African language AI."
authors = [
    {name = "Oladimeji",email = "boladimeji834@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "datasets (>=4.8.4,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
